name: 每日收盤選股

on:
  schedule:
    - cron: "0 10 * * 1-5"    # 台北時間週一到週五 18:00（GitHub 排程可能延遲幾分鐘到半小時）
    - cron: "0 13 * * 1-5"    # 台北時間 21:00 再跑一次，補上較晚更新的上櫃資料
    - cron: "30 14 * * 1-5"   # 台北時間 22:30，補上晚上才公布的融資融券
  workflow_dispatch:          # 可以在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓證交所資料並產生 data.js
        env:
          TZ: Asia/Taipei
          PYTHONIOENCODING: utf-8
        run: python screener.py --no-open

      - name: 存回倉庫（Cloudflare 會自動更新網頁）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data.js data
          if git diff --cached --quiet; then
            echo "資料沒有變更"
          else
            git commit -m "每日資料 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase
            git push
          fi
